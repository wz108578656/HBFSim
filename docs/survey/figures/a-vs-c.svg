<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="A 与 C 的关系：不同入口，共享同一段落盘路径">
  <defs>
    <marker id="ac-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b82a5"/>
    </marker>
    <marker id="ac-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7ee0b8"/>
    </marker>
    <style>
      .b{fill:#1b2130;stroke:#33405a;stroke-width:1.2}
      .src{fill:#141a26;stroke:#33405a;stroke-width:1.2}
      .shared{fill:#16241f;stroke:#37805e;stroke-width:1.4}
      .t{fill:#e6e9f0;font:13.5px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
      .s{fill:#9aa4b8;font:11.5px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
      .g{fill:#8fe0b5;font:12px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
      .l{stroke:#6b82a5;stroke-width:1.4;fill:none;marker-end:url(#ac-ar)}
      .lg{stroke:#7ee0b8;stroke-width:1.6;fill:none;marker-end:url(#ac-arg)}
      .ld{stroke:#6b7a93;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#ac-ar)}
    </style>
  </defs>
  <rect width="1000" height="460" fill="#0f1117"/>
  <text x="24" y="34" class="t" style="font-size:16px">A 与 C 的关系：换了一个入口，共享同一段“落盘”路径</text>
  <text x="24" y="56" class="s">A = 主机正常访存（读+写）；C = 从外部 tier 把数据灌回 HBF（只写方向）</text>

  <!-- shared landing box -->
  <rect x="452" y="150" width="470" height="180" rx="10" fill="none" stroke="#37805e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="466" y="174" class="g">共享段：Base die → NAND program/erase</text>
  <text x="466" y="192" class="s">A 的写方向 ＝ C 的第 ③ 段（同一个瓶颈）</text>

  <!-- row A -->
  <rect x="40" y="210" width="150" height="62" rx="7" class="src"/>
  <text x="115" y="236" text-anchor="middle" class="t">主机 xPU</text>
  <text x="115" y="256" text-anchor="middle" class="s">正常访存发起者</text>

  <rect x="230" y="210" width="180" height="62" rx="7" class="b"/>
  <text x="320" y="236" text-anchor="middle" class="t">HBIO 接口</text>
  <text x="320" y="256" text-anchor="middle" class="s">UCIe / AXI · 48/96/192</text>

  <rect x="486" y="210" width="150" height="62" rx="7" class="shared"/>
  <text x="561" y="236" text-anchor="middle" class="t">Base die</text>
  <text x="561" y="256" text-anchor="middle" class="s">TSV · ECC · SRAM</text>

  <rect x="700" y="210" width="190" height="62" rx="7" class="shared"/>
  <text x="795" y="236" text-anchor="middle" class="t">NAND</text>
  <text x="795" y="256" text-anchor="middle" class="s">program 75 µs · erase 2 ms</text>

  <path class="lg" d="M190 241 L226 241"/>
  <path class="lg" d="M410 241 L482 241"/>
  <path class="lg" d="M636 241 L696 241"/>
  <text x="200" y="232" class="g">A</text>

  <!-- read return -->
  <path class="ld" d="M795 206 L795 120 L115 120 L115 176"/>
  <text x="430" y="112" class="s">A 的读方向：数据沿同一条路径返回主机（接口带宽 96 GB/s 级）</text>

  <!-- row C -->
  <rect x="40" y="320" width="150" height="62" rx="7" class="src"/>
  <text x="115" y="346" text-anchor="middle" class="t">外部 backing</text>
  <text x="115" y="366" text-anchor="middle" class="s">CXL-SSD / NVMe / DRAM</text>

  <rect x="230" y="320" width="180" height="62" rx="7" class="b"/>
  <text x="320" y="346" text-anchor="middle" class="t">直连 lane</text>
  <text x="320" y="366" text-anchor="middle" class="s">32 GB/s · 100 ns</text>

  <path class="lg" d="M190 351 L226 351"/>
  <text x="196" y="342" class="g">C ①</text>
  <path class="lg" d="M410 351 L486 300"/>
  <text x="404" y="336" class="g">C ②</text>
  <path class="lg" d="M636 290 L696 280" style="visibility:hidden"/>
  <text x="656" y="306" class="g">C ③</text>

  <!-- bottom conclusions -->
  <rect x="40" y="400" width="936" height="44" rx="8" fill="#141a26" stroke="#2c3a52"/>
  <text x="56" y="427" class="s">结论：C 的第 ③ 段就是 A 的写方向，所以 C 的端到端带宽（0.744 GB/s）≈ A 写方向的极限；C 多付“外部读 + lane”两段，但它们不是瓶颈。</text>
</svg>
