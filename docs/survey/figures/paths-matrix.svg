<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="三条路径计费覆盖矩阵">
<style>.h{fill:#9aa4b8;font:12.5px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.c{fill:#e6e9f0;font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.ok{fill:#8fe0b5;font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.no{fill:#f0a8b4;font:12.5px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.na{fill:#5f6b80;font:13px system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.m{fill:#cfe3ff;font:12px ui-monospace,Menlo,Consolas,monospace}</style>
<rect width="1000" height="340" fill="#0f1117"/>
<text x="24" y="30" class="c" style="font-size:15px">三条路径的计费覆盖（绿色=计入 · 红色=不计入 · 灰色=不适用）</text>
<rect x="24" y="46" width="162" height="36" rx="5" fill="#161c28" stroke="#2c3a52"/>
<text x="105.0" y="70" text-anchor="middle" class="h">路径</text>
<rect x="194" y="46" width="142" height="36" rx="5" fill="#161c28" stroke="#2c3a52"/>
<text x="265.0" y="70" text-anchor="middle" class="h">外部 backing</text>
<rect x="344" y="46" width="132" height="36" rx="5" fill="#161c28" stroke="#2c3a52"/>
<text x="410.0" y="70" text-anchor="middle" class="h">直连 lane</text>
<rect x="484" y="46" width="178" height="36" rx="5" fill="#161c28" stroke="#2c3a52"/>
<text x="573.0" y="70" text-anchor="middle" class="h">HBIO / TSV / ECC</text>
<rect x="670" y="46" width="132" height="36" rx="5" fill="#161c28" stroke="#2c3a52"/>
<text x="736.0" y="70" text-anchor="middle" class="h">NAND 阵列</text>
<rect x="810" y="46" width="158" height="36" rx="5" fill="#161c28" stroke="#2c3a52"/>
<text x="889.0" y="70" text-anchor="middle" class="h">实测带宽</text>
<rect x="24" y="88" width="952" height="54" rx="6" fill="#141a26" stroke="#26324a"/>
<text x="105.0" y="117.0" text-anchor="middle" class="c">A · 主机 → HBF</text>
<text x="265.0" y="117.0" text-anchor="middle" class="na">—</text>
<text x="410.0" y="117.0" text-anchor="middle" class="na">—</text>
<text x="573.0" y="117.0" text-anchor="middle" class="ok">计入</text>
<text x="736.0" y="117.0" text-anchor="middle" class="ok">计入</text>
<text x="889.0" y="117.0" text-anchor="middle" class="m">48 / 96 GB/s·通道</text>
<rect x="24" y="150" width="952" height="54" rx="6" fill="#141a26" stroke="#26324a"/>
<text x="105.0" y="179.0" text-anchor="middle" class="c">B · 外部 → lane</text>
<text x="265.0" y="179.0" text-anchor="middle" class="no">不计</text>
<text x="410.0" y="179.0" text-anchor="middle" class="ok">计入</text>
<text x="573.0" y="179.0" text-anchor="middle" class="na">—</text>
<text x="736.0" y="179.0" text-anchor="middle" class="no">不计</text>
<text x="889.0" y="179.0" text-anchor="middle" class="m">31.9 GB/s</text>
<rect x="24" y="212" width="952" height="54" rx="6" fill="#141a26" stroke="#26324a"/>
<text x="105.0" y="241.0" text-anchor="middle" class="c">C · 端到端链</text>
<text x="265.0" y="241.0" text-anchor="middle" class="ok">计入</text>
<text x="410.0" y="241.0" text-anchor="middle" class="ok">计入</text>
<text x="573.0" y="241.0" text-anchor="middle" class="ok">计入</text>
<text x="736.0" y="241.0" text-anchor="middle" class="ok">计入·瓶颈</text>
<text x="889.0" y="241.0" text-anchor="middle" class="m">0.744 / 0.111 GB/s</text>
<text x="24" y="300" class="h">读法：B 与 C 走同一条 lane，差别在于一条事务计了哪几段；A 计满设备内部 → 设备接口带宽；B 只计 lane → 链路带宽；C 全计 → 落盘吞吐，瓶颈在 NAND。</text>
</svg>