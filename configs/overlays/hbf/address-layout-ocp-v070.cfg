# OCP HBF v0.7.0 section 4.6 channel-local address layout (p.22): the first
# four bits of the local page index select the bank and the next two select the
# die, which is the same algebra the section 5.7 replay recipe uses (p.63).
# The default (bank-major) keeps one contiguous capacity range per bank; this
# overlay instead rotates a sequential stream over every bank and die.
hbf-address-layout=ocp-v070
